# Temporary public preview only. The production deployment uses compose.production.yaml.
services:
  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.preview
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver --insecure 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; req=urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(req, timeout=3)"

  cloudflared-preview:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:8000
    restart: "no"
