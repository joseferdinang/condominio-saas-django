x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-condominio-pilot:local}
  build:
    context: .
    target: production
  env_file: ${ENV_FILE:-.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  secrets:
    - django_secret_key
    - postgres_password
  volumes:
    - media:/app/media
    - static:/app/staticfiles
  networks: [database, proxy, outbound]
  read_only: true
  tmpfs:
    - /tmp:size=134217728,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  logging: *logging

services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-condominio}
      POSTGRES_USER: ${POSTGRES_USER:-condominio}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [database]
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    shm_size: 128m
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    <<: *app
    mem_limit: 768m
    restart: unless-stopped
    stop_grace_period: 100s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, ops/healthcheck.py]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  maintenance:
    <<: *app
    profiles: [tools]
    mem_limit: 512m
    restart: "no"
    command: [python, manage.py, check, --deploy]

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    ports:
      - "${HTTP_BIND:-0.0.0.0:80}:80"
      - "${HTTPS_BIND:-0.0.0.0:443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Define APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy, outbound]
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *logging
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy

networks:
  database:
    internal: true
  proxy:
    internal: true
  outbound:

volumes:
  postgres:
  media:
  static:
  caddy_data:
  caddy_config:

secrets:
  django_secret_key:
    file: ${SECRETS_DIR:-.secrets}/django_secret_key
  postgres_password:
    file: ${SECRETS_DIR:-.secrets}/postgres_password
