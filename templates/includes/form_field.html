<div class="field-group{% if field.errors %} field-has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span><span class="sr-only"> obligatorio</span>{% else %}<span class="optional-label">Opcional</span>{% endif %}</label>
  <div class="{% if field.name == 'importe_total' or field.name == 'importe' %}money-field{% endif %}">{% if field.name == 'importe_total' or field.name == 'importe' %}<span aria-hidden="true">RD$</span>{% endif %}{{ field }}</div>
  {% if field.help_text %}<small class="helptext" id="{{ field.id_for_label }}_help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="field-error" role="alert">{{ error }}</small>{% endfor %}
</div>
